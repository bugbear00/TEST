<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kids Learning App Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: linear-gradient(180deg, #87CEEB 0%, #98FB98 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 메인 메뉴 */
    .main-menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-title {
      font-size: 2.2em;
      color: #333;
      text-align: center;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 400px;
      width: 100%;
    }

    .menu-btn {
      background: white;
      border: none;
      border-radius: 20px;
      padding: 25px 15px;
      font-size: 1.2em;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .menu-btn:hover, .menu-btn:active {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }

    .menu-btn.math { background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); }
    .menu-btn.english { background: linear-gradient(135deg, #87CEEB 0%, #4169E1 100%); color: white; }

    .menu-icon { font-size: 2.5em; }

    /* 게임 화면 공통 */
    .game-screen {
      display: none;
      min-height: 100vh;
      padding: 15px;
      padding-bottom: 100px;
    }

    .game-screen.active { display: block; }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 10px;
    }

    .back-btn {
      background: white;
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      font-size: 1.3em;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }

    .score-display {
      background: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 1.1em;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }

    .game-title {
      font-size: 1.3em;
      color: #333;
      text-align: center;
      flex: 1;
      white-space: nowrap;
    }

    /* 선택 버튼들 */
    .selector {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .selector-btn {
      background: white;
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 10px 15px;
      font-size: 0.95em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .selector-btn.active {
      border-color: #4169E1;
      background: #4169E1;
      color: white;
    }

    /* 문제 카드 */
    .question-card {
      background: white;
      border-radius: 25px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      max-width: 500px;
      margin: 0 auto 20px;
    }

    .question-text {
      font-size: 2.5em;
      color: #333;
      margin-bottom: 20px;
      font-weight: bold;
      line-height: 1.3;
    }

    .question-sub {
      font-size: 1.3em;
      color: #666;
      margin-bottom: 15px;
    }

    /* 시각적 객체 표시 */
    .visual-objects {
      font-size: 2em;
      margin: 15px 0;
      line-height: 1.5;
      word-break: break-all;
    }

    /* 답 버튼들 */
    .answers-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 500px;
      margin: 0 auto;
    }

    .answers-grid.single-col {
      grid-template-columns: 1fr;
    }

    .answer-btn {
      background: white;
      border: 3px solid #ddd;
      border-radius: 15px;
      padding: 18px 10px;
      font-size: 1.5em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      word-break: keep-all;
    }

    .answer-btn:hover, .answer-btn:active {
      border-color: #4169E1;
      background: #f0f8ff;
      transform: scale(1.02);
    }

    .answer-btn.correct {
      background: #90EE90 !important;
      border-color: #32CD32 !important;
      animation: correct-pulse 0.5s;
    }

    .answer-btn.wrong {
      background: #FFB6C1 !important;
      border-color: #FF6B6B !important;
      animation: wrong-shake 0.5s;
    }

    @keyframes correct-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes wrong-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    /* 입력 필드 */
    .input-area {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .answer-input {
      font-size: 1.5em;
      padding: 15px 20px;
      border: 3px solid #4169E1;
      border-radius: 15px;
      text-align: center;
      width: 200px;
      outline: none;
    }

    .submit-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 15px;
      padding: 15px 30px;
      font-size: 1.3em;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }

    /* 피드백 */
    .feedback {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4em;
      z-index: 100;
      animation: feedback-pop 0.8s forwards;
      pointer-events: none;
    }

    @keyframes feedback-pop {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    /* 영어 학습 카드 */
    .learn-card {
      background: white;
      border-radius: 25px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      max-width: 500px;
      margin: 0 auto 20px;
    }

    .word-image { font-size: 5em; margin-bottom: 15px; }
    .word-english { font-size: 2.2em; color: #4169E1; font-weight: bold; margin-bottom: 8px; }
    .word-korean { font-size: 1.5em; color: #666; margin-bottom: 15px; }

    .speak-btn {
      background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
      border: none;
      border-radius: 50%;
      width: 70px;
      height: 70px;
      font-size: 1.8em;
      color: white;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(255,107,107,0.4);
    }

    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    .nav-btn {
      background: white;
      border: 3px solid #4169E1;
      border-radius: 50%;
      width: 55px;
      height: 55px;
      font-size: 1.3em;
      cursor: pointer;
    }

    /* 진행 바 */
    .progress-bar {
      background: rgba(255,255,255,0.5);
      border-radius: 10px;
      height: 15px;
      margin: 15px auto;
      max-width: 500px;
      overflow: hidden;
    }

    .progress-fill {
      background: linear-gradient(90deg, #FFD700, #FFA500);
      height: 100%;
      border-radius: 10px;
      transition: width 0.3s;
    }

    /* 결과 화면 */
    .result-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .result-screen.active { display: flex; }

    .result-card {
      background: white;
      border-radius: 25px;
      padding: 40px 30px;
      text-align: center;
      max-width: 350px;
      margin: 20px;
    }

    .result-emoji { font-size: 4em; margin-bottom: 15px; }
    .result-title { font-size: 1.8em; color: #333; margin-bottom: 10px; }
    .result-score { font-size: 2.5em; color: #FFD700; font-weight: bold; margin-bottom: 25px; }

    .result-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 20px;
      padding: 15px 30px;
      font-size: 1.1em;
      font-weight: bold;
      color: white;
      cursor: pointer;
      margin: 8px;
    }

    /* 철자 입력 */
    .spelling-area {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .letter-box {
      width: 45px;
      height: 55px;
      border: 3px solid #4169E1;
      border-radius: 10px;
      font-size: 1.8em;
      text-align: center;
      text-transform: uppercase;
      outline: none;
    }

    .letter-box.correct { border-color: #32CD32; background: #90EE90; }
    .letter-box.wrong { border-color: #FF6B6B; background: #FFB6C1; }

    /* 비교 문제 */
    .compare-area {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      font-size: 2.5em;
      font-weight: bold;
      margin: 20px 0;
    }

    .compare-num {
      background: white;
      padding: 15px 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .compare-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .compare-btn {
      background: white;
      border: 3px solid #FFD700;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 1.5em;
      cursor: pointer;
      transition: all 0.2s;
    }

    .compare-btn:hover { background: #FFF8DC; }

    /* 모바일 최적화 */
    @media (max-width: 500px) {
      .question-text { font-size: 2em; }
      .answer-btn { font-size: 1.3em; padding: 15px 8px; }
      .visual-objects { font-size: 1.5em; }
      .letter-box { width: 38px; height: 48px; font-size: 1.5em; }
    }
  </style>
</head>
<body>

<!-- 메인 메뉴 -->
<div id="mainMenu" class="main-menu">
  <h1 class="main-title">Kids Learning App Pro</h1>
  <div class="menu-grid">
    <button class="menu-btn math" onclick="startMath()">
      <span class="menu-icon">🔢</span>
      <span>수학</span>
    </button>
    <button class="menu-btn english" onclick="startEnglish()">
      <span class="menu-icon">🔤</span>
      <span>영어</span>
    </button>
  </div>
</div>

<!-- 수학 게임 -->
<div id="mathGame" class="game-screen">
  <div class="game-header">
    <button class="back-btn" onclick="goHome()">🏠</button>
    <span class="game-title">🔢 수학</span>
    <div class="score-display">⭐ <span id="mathScore">0</span></div>
  </div>

  <div class="selector" id="gradeSelector">
    <button class="selector-btn active" onclick="setMathGrade(1)">1학년</button>
    <button class="selector-btn" onclick="setMathGrade(2)">2학년</button>
    <button class="selector-btn" onclick="setMathGrade(3)">3학년</button>
  </div>

  <div class="selector" id="mathTypeSelector">
    <button class="selector-btn active" onclick="setMathType('calc')">계산</button>
    <button class="selector-btn" onclick="setMathType('count')">세기</button>
    <button class="selector-btn" onclick="setMathType('compare')">비교</button>
    <button class="selector-btn" onclick="setMathType('blank')">빈칸</button>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="mathProgress" style="width: 0%"></div>
  </div>

  <div id="mathContent">
    <!-- 동적 생성 -->
  </div>
</div>

<!-- 영어 게임 -->
<div id="englishGame" class="game-screen">
  <div class="game-header">
    <button class="back-btn" onclick="goHome()">🏠</button>
    <span class="game-title">🔤 영어</span>
    <div class="score-display">⭐ <span id="englishScore">0</span></div>
  </div>

  <div class="selector" id="levelSelector">
    <button class="selector-btn active" onclick="setEnglishLevel('basic')">기초</button>
    <button class="selector-btn" onclick="setEnglishLevel('intermediate')">중급</button>
    <button class="selector-btn" onclick="setEnglishLevel('sentences')">문장</button>
  </div>

  <div class="selector" id="engTypeSelector">
    <button class="selector-btn active" onclick="setEnglishType('learn')">배우기</button>
    <button class="selector-btn" onclick="setEnglishType('quiz')">뜻 맞추기</button>
    <button class="selector-btn" onclick="setEnglishType('listen')">듣기</button>
    <button class="selector-btn" onclick="setEnglishType('spell')">철자</button>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="englishProgress" style="width: 0%"></div>
  </div>

  <div id="englishContent">
    <!-- 동적 생성 -->
  </div>
</div>

<!-- 결과 화면 -->
<div id="resultScreen" class="result-screen">
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-title" id="resultTitle">잘했어요!</div>
    <div class="result-score" id="resultScore">10/10</div>
    <button class="result-btn" onclick="continueGame()">계속하기</button>
    <button class="result-btn" onclick="goHome()">🏠 홈으로</button>
  </div>
</div>

<!-- 피드백 이펙트 -->
<div id="feedback" class="feedback" style="display:none;"></div>

let currentScreen = 'mainMenu';

// ========== 음성 합성 ==========
function speak(text, lang = 'en-US') {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang;
    utterance.rate = 0.8;
    utterance.pitch = 1.1;
    window.speechSynthesis.speak(utterance);
  }
}

// ========== 화면 전환 ==========
function showScreen(screenId) {
  document.querySelectorAll('.main-menu, .game-screen').forEach(el => {
    el.style.display = 'none';
    el.classList.remove('active');
  });
  const screen = document.getElementById(screenId);
  screen.style.display = screenId === 'mainMenu' ? 'flex' : 'block';
  screen.classList.add('active');
  currentScreen = screenId;
}

function goHome() {
  document.getElementById('resultScreen').classList.remove('active');
  showScreen('mainMenu');

// ========== 수학 게임 ==========
function startMath() {
  showScreen('mathGame');
  mathScore = 0;
  mathCorrect = 0;
  mathTotal = 0;
  updateMathScore();
  generateMathQuestion();
}

function setMathGrade(grade) {
  mathGrade = grade;
  document.querySelectorAll('#gradeSelector .selector-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i + 1 === grade);
  });
  mathTotal = 0;
  mathCorrect = 0;
  updateProgress('mathProgress', 0, 10);
  generateMathQuestion();
}

function setMathType(type) {
  mathType = type;
  const types = ['calc', 'count', 'compare', 'blank'];
  document.querySelectorAll('#mathTypeSelector .selector-btn').forEach((btn, i) => {
    btn.classList.toggle('active', types[i] === type);
  });
  mathTotal = 0;
  mathCorrect = 0;
  updateProgress('mathProgress', 0, 10);
  generateMathQuestion();
}

function generateMathQuestion() {
  const content = document.getElementById('mathContent');

  if (mathType === 'calc') {
    generateCalcQuestion(content);
  } else if (mathType === 'count') {
    generateCountQuestion(content);
  } else if (mathType === 'compare') {
    generateCompareQuestion(content);
  } else if (mathType === 'blank') {
    generateBlankQuestion(content);
  }
}

function generateCalcQuestion(content) {
  let num1, num2, operator, answer;

  if (mathGrade === 1) {
    num1 = Math.floor(Math.random() * 10) + 1;
    num2 = Math.floor(Math.random() * 10) + 1;
    if (Math.random() > 0.5) {
      operator = '+';
      answer = num1 + num2;
    } else {
      if (num1 < num2) [num1, num2] = [num2, num1];
      operator = '-';
      answer = num1 - num2;
    }
  } else if (mathGrade === 2) {
    const type = Math.random();
    if (type < 0.4) {
      num1 = Math.floor(Math.random() * 50) + 10;
      num2 = Math.floor(Math.random() * 30) + 1;
      operator = '+';
      answer = num1 + num2;
    } else if (type < 0.7) {
      num1 = Math.floor(Math.random() * 50) + 30;
      num2 = Math.floor(Math.random() * 30) + 1;
      operator = '-';
      answer = num1 - num2;
    } else {
      num1 = Math.floor(Math.random() * 9) + 1;
      num2 = Math.floor(Math.random() * 9) + 1;
      operator = '×';
      answer = num1 * num2;
    }
  } else {
    const type = Math.random();
    if (type < 0.35) {
      num1 = Math.floor(Math.random() * 12) + 1;
      num2 = Math.floor(Math.random() * 12) + 1;
      operator = '×';
      answer = num1 * num2;
    } else if (type < 0.7) {
      num2 = Math.floor(Math.random() * 9) + 1;
      answer = Math.floor(Math.random() * 9) + 1;
      num1 = num2 * answer;
      operator = '÷';
    } else {
      num1 = Math.floor(Math.random() * 100) + 50;
      num2 = Math.floor(Math.random() * 50) + 1;
      operator = Math.random() > 0.5 ? '+' : '-';
      if (operator === '-' && num1 < num2) [num1, num2] = [num2, num1];
      answer = operator === '+' ? num1 + num2 : num1 - num2;
    }
  }

  currentMathAnswer = answer;
  const options = generateOptions(answer, mathGrade === 1 ? 10 : 20);

  content.innerHTML = `
    <div class="question-card">
      <div class="question-text">${num1} ${operator} ${num2} = ?</div>
    </div>
    <div class="answers-grid">
      ${options.map(opt => `<button class="answer-btn" onclick="checkMathAnswer(${opt}, this)">${opt}</button>`).join('')}
    </div>
  `;
}

function generateCountQuestion(content) {
  const emojis = ['🍎', '⭐', '🌸', '🎈', '🐟', '🍪', '💎', '🎁'];
  const emoji = emojis[Math.floor(Math.random() * emojis.length)];

  let maxCount = mathGrade === 1 ? 10 : mathGrade === 2 ? 20 : 30;
  const count = Math.floor(Math.random() * maxCount) + 1;

  currentMathAnswer = count;
  const options = generateOptions(count, 5);

  content.innerHTML = `
    <div class="question-card">
      <div class="question-sub">몇 개일까요?</div>
      <div class="visual-objects">${emoji.repeat(count)}</div>
    </div>
    <div class="answers-grid">
      ${options.map(opt => `<button class="answer-btn" onclick="checkMathAnswer(${opt}, this)">${opt}</button>`).join('')}
    </div>
  `;
}

function generateCompareQuestion(content) {
  let max = mathGrade === 1 ? 20 : mathGrade === 2 ? 100 : 1000;
  let num1 = Math.floor(Math.random() * max) + 1;
  let num2 = Math.floor(Math.random() * max) + 1;

  // 같은 수가 나오지 않게
  while (num1 === num2) {
    num2 = Math.floor(Math.random() * max) + 1;
  }

  currentMathAnswer = num1 > num2 ? '>' : '<';

  content.innerHTML = `
    <div class="question-card">
      <div class="question-sub">어느 쪽이 더 클까요?</div>
      <div class="compare-area">
        <span class="compare-num">${num1}</span>
        <div class="compare-btns">
          <button class="compare-btn" onclick="checkCompare('>', this)">＞</button>
          <button class="compare-btn" onclick="checkCompare('<', this)">＜</button>
        </div>
        <span class="compare-num">${num2}</span>
      </div>
    </div>
  `;
}

function generateBlankQuestion(content) {
  let num1, num2, answer, operator, blank;

  if (mathGrade === 1) {
    num1 = Math.floor(Math.random() * 10) + 1;
    num2 = Math.floor(Math.random() * 10) + 1;
    operator = Math.random() > 0.5 ? '+' : '-';
    if (operator === '-' && num1 < num2) [num1, num2] = [num2, num1];
    answer = operator === '+' ? num1 + num2 : num1 - num2;
  } else {
    num1 = Math.floor(Math.random() * 9) + 1;
    num2 = Math.floor(Math.random() * 9) + 1;
    operator = '×';
    answer = num1 * num2;
  }

  // 빈칸 위치 결정 (첫번째, 두번째, 결과 중 하나)
  const blankPos = Math.floor(Math.random() * 3);
  let question, correctAnswer;

  if (blankPos === 0) {
    question = `? ${operator} ${num2} = ${answer}`;
    correctAnswer = num1;
  } else if (blankPos === 1) {
    question = `${num1} ${operator} ? = ${answer}`;
    correctAnswer = num2;
  } else {
    question = `${num1} ${operator} ${num2} = ?`;
    correctAnswer = answer;
  }

  currentMathAnswer = correctAnswer;
  const options = generateOptions(correctAnswer, mathGrade === 1 ? 5 : 10);

  content.innerHTML = `
    <div class="question-card">
      <div class="question-sub">빈칸에 알맞은 수는?</div>
      <div class="question-text">${question}</div>
    </div>
    <div class="answers-grid">
      ${options.map(opt => `<button class="answer-btn" onclick="checkMathAnswer(${opt}, this)">${opt}</button>`).join('')}
    </div>
  `;
}

function generateOptions(correct, range) {
  const options = new Set([correct]);
  while (options.size < 4) {
    let wrong = correct + Math.floor(Math.random() * range * 2) - range;
    if (wrong < 0) wrong = Math.abs(wrong);
    if (wrong !== correct) options.add(wrong);
  }
  return Array.from(options).sort(() => Math.random() - 0.5);
}

function checkMathAnswer(selected, btn) {
  mathTotal++;
  const correct = selected === currentMathAnswer;

  if (correct) {
    mathCorrect++;
    mathScore += 10;
    btn.classList.add('correct');
    showFeedback('🎉');
    speak('Great!');
  } else {
    btn.classList.add('wrong');
    showFeedback('😅');
    document.querySelectorAll('.answer-btn').forEach(b => {
      if (parseInt(b.textContent) === currentMathAnswer) b.classList.add('correct');
    });
  }

  updateMathScore();
  updateProgress('mathProgress', mathTotal, 10);

  if (mathTotal >= 10) {
    setTimeout(() => showResult('math'), 1000);
  } else {
    setTimeout(generateMathQuestion, 1000);
  }
}

function checkCompare(selected, btn) {
  mathTotal++;
  const correct = selected === currentMathAnswer;

  if (correct) {
    mathCorrect++;
    mathScore += 10;
    btn.style.background = '#90EE90';
    showFeedback('🎉');
    speak('Correct!');
  } else {
    btn.style.background = '#FFB6C1';
    showFeedback('😅');
  }

  updateMathScore();
  updateProgress('mathProgress', mathTotal, 10);

  if (mathTotal >= 10) {
    setTimeout(() => showResult('math'), 1000);
  } else {
    setTimeout(generateMathQuestion, 1000);
  }
}

function updateMathScore() {
  document.getElementById('mathScore').textContent = mathScore;
}

function generateLearnContent(content) {
  const words = englishData[englishLevel];
  const word = words[currentWordIndex];

  content.innerHTML = `
    <div class="learn-card">
      <div class="word-image">${word.image}</div>
      <div class="word-english">${word.word}</div>
      <div class="word-korean">${word.korean}</div>
      <button class="speak-btn" onclick="speak('${word.word.replace(/'/g, "\\'")}')">🔊</button>
    </div>
    <div class="nav-buttons">
      <button class="nav-btn" onclick="prevWord()">⬅️</button>
      <button class="nav-btn" onclick="nextWord()">➡️</button>
    </div>
  `;

  updateProgress('englishProgress', currentWordIndex + 1, words.length);
  speak(word.word);
}

function nextWord() {
  const words = englishData[englishLevel];
  currentWordIndex = (currentWordIndex + 1) % words.length;
  generateLearnContent(document.getElementById('englishContent'));
}

function prevWord() {
  const words = englishData[englishLevel];
  currentWordIndex = (currentWordIndex - 1 + words.length) % words.length;
  generateLearnContent(document.getElementById('englishContent'));
}

function generateQuizContent(content) {
  const words = englishData[englishLevel];
  const correctWord = words[Math.floor(Math.random() * words.length)];
  currentEnglishAnswer = correctWord.korean;

  const options = new Set([correctWord.korean]);
  while (options.size < 4) {
    const randomWord = words[Math.floor(Math.random() * words.length)];
    options.add(randomWord.korean);
  }

  const shuffled = Array.from(options).sort(() => Math.random() - 0.5);

  content.innerHTML = `
    <div class="question-card">
      <div class="question-text" style="font-size:2em;color:#4169E1;">${correctWord.word}</div>
      <div class="question-sub">이 단어의 뜻은?</div>
    </div>
    <div class="answers-grid">
      ${shuffled.map(opt => `<button class="answer-btn" style="font-size:1.2em;" onclick="checkEnglishAnswer('${opt}', this)">${opt}</button>`).join('')}
    </div>
  `;

  speak(correctWord.word);
}

function generateListenContent(content) {
  const words = englishData[englishLevel];
  const correctWord = words[Math.floor(Math.random() * words.length)];
  currentEnglishAnswer = correctWord.word;

  const options = new Set([correctWord.word]);
  while (options.size < 4) {
    const randomWord = words[Math.floor(Math.random() * words.length)];
    options.add(randomWord.word);
  }

  const shuffled = Array.from(options).sort(() => Math.random() - 0.5);

  content.innerHTML = `
    <div class="question-card">
      <div class="question-sub">듣고 맞는 단어를 고르세요</div>
      <button class="speak-btn" onclick="speak('${correctWord.word.replace(/'/g, "\\'")}')">🔊</button>
    </div>
    <div class="answers-grid">
      ${shuffled.map(opt => `<button class="answer-btn" style="font-size:1.1em;" onclick="checkListenAnswer('${opt.replace(/'/g, "\\'")}', this)">${opt}</button>`).join('')}
    </div>
  `;

  setTimeout(() => speak(correctWord.word), 500);
}

function generateSpellContent(content) {
  const words = englishData[englishLevel].filter(w => w.word.length <= 8 && !w.word.includes(' '));
  if (words.length === 0) {
    generateQuizContent(content);
    return;
  }

  const correctWord = words[Math.floor(Math.random() * words.length)];
  currentEnglishAnswer = correctWord.word.toUpperCase();

  const letters = correctWord.word.split('');

  content.innerHTML = `
    <div class="question-card">
      <div class="word-image">${correctWord.image}</div>
      <div class="question-sub">${correctWord.korean}</div>
      <button class="speak-btn" onclick="speak('${correctWord.word}')" style="margin-bottom:15px;">🔊</button>
      <div class="spelling-area">
        ${letters.map((_, i) => `<input type="text" class="letter-box" maxlength="1" data-index="${i}" onkeyup="handleSpellInput(event, ${i})">`).join('')}
      </div>
    </div>
    <div style="text-align:center;">
      <button class="submit-btn" onclick="checkSpelling()">확인</button>
    </div>
  `;

  setTimeout(() => {
    speak(correctWord.word);
    document.querySelector('.letter-box').focus();
  }, 300);
}

function handleSpellInput(event, index) {
  const inputs = document.querySelectorAll('.letter-box');
  if (event.key === 'Backspace' && index > 0 && !inputs[index].value) {
    inputs[index - 1].focus();
  } else if (inputs[index].value && index < inputs.length - 1) {
    inputs[index + 1].focus();
  } else if (event.key === 'Enter') {
    checkSpelling();
  }
}

function checkSpelling() {
  const inputs = document.querySelectorAll('.letter-box');
  let userAnswer = '';
  inputs.forEach(input => userAnswer += input.value);
  userAnswer = userAnswer.toUpperCase();

  englishTotal++;
  const correct = userAnswer === currentEnglishAnswer;

  inputs.forEach((input, i) => {
    if (input.value.toUpperCase() === currentEnglishAnswer[i]) {
      input.classList.add('correct');
    } else {
      input.classList.add('wrong');
    }
  });

  if (correct) {
    englishCorrect++;
    englishScore += 10;
    showFeedback('🎉');
    speak('Perfect!');
  } else {
    showFeedback('😅');
  }

  updateEnglishScore();
  updateProgress('englishProgress', englishTotal, 10);

  if (englishTotal >= 10) {
    setTimeout(() => showResult('english'), 1500);
  } else {
    setTimeout(generateEnglishContent, 1500);
  }
}

// ========== 공통 함수 ==========
function updateProgress(id, current, total) {
  const percent = (current / total) * 100;
  document.getElementById(id).style.width = `${percent}%`;
}

function showFeedback(emoji) {
  const feedback = document.getElementById('feedback');
  feedback.textContent = emoji;
  feedback.style.display = 'block';
  setTimeout(() => feedback.style.display = 'none', 800);
}

function showResult(type) {
  const correct = type === 'math' ? mathCorrect : englishCorrect;
  const percent = (correct / 10) * 100;

  let emoji, title;
  if (percent >= 90) { emoji = '🏆'; title = '최고예요!'; }
  else if (percent >= 70) { emoji = '🎉'; title = '잘했어요!'; }
  else if (percent >= 50) { emoji = '😊'; title = '좋아요!'; }
  else { emoji = '💪'; title = '다시 도전!'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultScore').textContent = `${correct}/10`;
  document.getElementById('resultScreen').classList.add('active');

  if (percent >= 70) speak('Congratulations!');
}

function continueGame() {
  document.getElementById('resultScreen').classList.remove('active');

  if (currentScreen === 'mathGame') {
    mathTotal = 0;
    mathCorrect = 0;
    updateProgress('mathProgress', 0, 10);
    generateMathQuestion();
  } else {
    englishTotal = 0;
    englishCorrect = 0;
    updateProgress('englishProgress', 0, 10);
    generateEnglishContent();
  }
}
