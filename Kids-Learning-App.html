<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎮 재미있는 학습 게임</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: linear-gradient(180deg, #87CEEB 0%, #98FB98 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 메인 메뉴 */
    .main-menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-title {
      font-size: 2.5em;
      color: #333;
      text-align: center;
      margin-bottom: 40px;
      text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 400px;
      width: 100%;
    }

    .menu-btn {
      background: white;
      border: none;
      border-radius: 20px;
      padding: 30px 20px;
      font-size: 1.3em;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .menu-btn:hover, .menu-btn:active {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }

    .menu-btn.math { background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); }
    .menu-btn.english { background: linear-gradient(135deg, #87CEEB 0%, #4169E1 100%); color: white; }

    .menu-icon { font-size: 3em; }

    /* 게임 화면 공통 */
    .game-screen {
      display: none;
      min-height: 100vh;
      padding: 20px;
      padding-bottom: 100px;
    }

    .game-screen.active { display: block; }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn {
      background: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 1.5em;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .score-display {
      background: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 1.2em;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .game-title {
      font-size: 1.5em;
      color: #333;
      text-align: center;
      flex: 1;
    }

    /* 학년 선택 */
    .grade-selector {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .grade-btn {
      background: white;
      border: 3px solid #ddd;
      border-radius: 15px;
      padding: 15px 25px;
      font-size: 1.2em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .grade-btn.active {
      border-color: #FFD700;
      background: #FFF8DC;
      transform: scale(1.05);
    }

    /* 문제 카드 */
    .question-card {
      background: white;
      border-radius: 30px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      max-width: 500px;
      margin: 0 auto 30px;
    }

    .question-text {
      font-size: 3em;
      color: #333;
      margin-bottom: 30px;
      font-weight: bold;
    }

    .question-text.english-word {
      font-size: 2.5em;
      color: #4169E1;
    }

    .question-meaning {
      font-size: 1.5em;
      color: #666;
      margin-bottom: 20px;
    }

    /* 답 버튼들 */
    .answers-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 500px;
      margin: 0 auto;
    }

    .answer-btn {
      background: white;
      border: 3px solid #ddd;
      border-radius: 20px;
      padding: 25px;
      font-size: 1.8em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .answer-btn:hover, .answer-btn:active {
      border-color: #4169E1;
      background: #f0f8ff;
      transform: scale(1.03);
    }

    .answer-btn.correct {
      background: #90EE90 !important;
      border-color: #32CD32 !important;
      animation: correct-pulse 0.5s;
    }

    .answer-btn.wrong {
      background: #FFB6C1 !important;
      border-color: #FF6B6B !important;
      animation: wrong-shake 0.5s;
    }

    @keyframes correct-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes wrong-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    /* 피드백 */
    .feedback {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 5em;
      z-index: 100;
      animation: feedback-pop 0.8s forwards;
      pointer-events: none;
    }

    @keyframes feedback-pop {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    /* 영어 학습 모드 선택 */
    .mode-selector {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .mode-btn {
      background: white;
      border: 3px solid #4169E1;
      border-radius: 25px;
      padding: 15px 30px;
      font-size: 1.1em;
      font-weight: bold;
      color: #4169E1;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: #4169E1;
      color: white;
    }

    /* 영어 카드 */
    .english-card {
      background: white;
      border-radius: 30px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      max-width: 500px;
      margin: 0 auto 30px;
    }

    .word-image {
      font-size: 6em;
      margin-bottom: 20px;
    }

    .word-english {
      font-size: 2.5em;
      color: #4169E1;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .word-korean {
      font-size: 1.8em;
      color: #666;
      margin-bottom: 20px;
    }

    .speak-btn {
      background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
      border: none;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      font-size: 2em;
      color: white;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(255,107,107,0.4);
      transition: transform 0.2s;
    }

    .speak-btn:hover, .speak-btn:active {
      transform: scale(1.1);
    }

    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .nav-btn {
      background: white;
      border: 3px solid #4169E1;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 1.5em;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn:hover { background: #f0f8ff; }

    /* 진행 바 */
    .progress-bar {
      background: rgba(255,255,255,0.5);
      border-radius: 10px;
      height: 20px;
      margin: 20px auto;
      max-width: 500px;
      overflow: hidden;
    }

    .progress-fill {
      background: linear-gradient(90deg, #FFD700, #FFA500);
      height: 100%;
      border-radius: 10px;
      transition: width 0.3s;
    }

    /* 결과 화면 */
    .result-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .result-screen.active { display: flex; }

    .result-card {
      background: white;
      border-radius: 30px;
      padding: 50px;
      text-align: center;
      max-width: 400px;
      margin: 20px;
    }

    .result-emoji { font-size: 5em; margin-bottom: 20px; }
    .result-title { font-size: 2em; color: #333; margin-bottom: 10px; }
    .result-score { font-size: 3em; color: #FFD700; font-weight: bold; margin-bottom: 30px; }

    .result-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 25px;
      padding: 20px 40px;
      font-size: 1.3em;
      font-weight: bold;
      color: white;
      cursor: pointer;
      margin: 10px;
    }

    /* 레벨 선택 (영어) */
    .level-selector {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .level-btn {
      background: white;
      border: 2px solid #4169E1;
      border-radius: 15px;
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
    }

    .level-btn.active {
      background: #4169E1;
      color: white;
    }

    /* 모바일 최적화 */
    @media (max-width: 500px) {
      .question-text { font-size: 2.5em; }
      .answer-btn { font-size: 1.5em; padding: 20px; }
      .menu-btn { padding: 20px 15px; }
      .question-card { padding: 30px 20px; }
    }
  </style>
</head>
<body>

<!-- 메인 메뉴 -->
<div id="mainMenu" class="main-menu">
  <h1 class="main-title">🎮 재미있는 학습 게임</h1>
  <div class="menu-grid">
    <button class="menu-btn math" onclick="startMath()">
      <span class="menu-icon">🔢</span>
      <span>수학</span>
    </button>
    <button class="menu-btn english" onclick="startEnglish()">
      <span class="menu-icon">🔤</span>
      <span>영어</span>
    </button>
  </div>
</div>

<!-- 수학 게임 -->
<div id="mathGame" class="game-screen">
  <div class="game-header">
    <button class="back-btn" onclick="goHome()">🏠</button>
    <span class="game-title">🔢 수학</span>
    <div class="score-display">⭐ <span id="mathScore">0</span></div>
  </div>

  <div class="grade-selector">
    <button class="grade-btn active" onclick="setMathGrade(1)">1학년</button>
    <button class="grade-btn" onclick="setMathGrade(2)">2학년</button>
    <button class="grade-btn" onclick="setMathGrade(3)">3학년</button>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="mathProgress" style="width: 0%"></div>
  </div>

  <div class="question-card">
    <div class="question-text" id="mathQuestion">3 + 2 = ?</div>
  </div>

  <div class="answers-grid" id="mathAnswers">
    <!-- 동적 생성 -->
  </div>
</div>

<!-- 영어 게임 -->
<div id="englishGame" class="game-screen">
  <div class="game-header">
    <button class="back-btn" onclick="goHome()">🏠</button>
    <span class="game-title">🔤 영어</span>
    <div class="score-display">⭐ <span id="englishScore">0</span></div>
  </div>

  <div class="level-selector">
    <button class="level-btn active" onclick="setEnglishLevel('basic')">기초</button>
    <button class="level-btn" onclick="setEnglishLevel('intermediate')">중급</button>
    <button class="level-btn" onclick="setEnglishLevel('sentences')">문장</button>
  </div>

  <div class="mode-selector">
    <button class="mode-btn active" onclick="setEnglishMode('learn')">📖 배우기</button>
    <button class="mode-btn" onclick="setEnglishMode('quiz')">❓ 퀴즈</button>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="englishProgress" style="width: 0%"></div>
  </div>

  <!-- 학습 모드 -->
  <div id="learnMode">
    <div class="english-card">
      <div class="word-image" id="wordImage">🍎</div>
      <div class="word-english" id="wordEnglish">Apple</div>
      <div class="word-korean" id="wordKorean">사과</div>
      <button class="speak-btn" onclick="speakWord()">🔊</button>
    </div>
    <div class="nav-buttons">
      <button class="nav-btn" onclick="prevWord()">⬅️</button>
      <button class="nav-btn" onclick="nextWord()">➡️</button>
    </div>
  </div>

  <!-- 퀴즈 모드 -->
  <div id="quizMode" style="display:none;">
    <div class="question-card">
      <div class="question-text english-word" id="quizWord">Apple</div>
      <div class="question-meaning" id="quizHint">🍎</div>
    </div>
    <div class="answers-grid" id="englishAnswers">
      <!-- 동적 생성 -->
    </div>
  </div>
</div>

<!-- 결과 화면 -->
<div id="resultScreen" class="result-screen">
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-title" id="resultTitle">잘했어요!</div>
    <div class="result-score" id="resultScore">10/10</div>
    <button class="result-btn" onclick="continueGame()">계속하기</button>
    <button class="result-btn" onclick="goHome()">🏠 홈으로</button>
  </div>
</div>

<!-- 피드백 이펙트 -->
<div id="feedback" class="feedback" style="display:none;"></div>

<script>
// ========== 데이터 ==========

// 영어 단어 데이터
const englishData = {
  basic: [
    { word: 'Apple', korean: '사과', image: '🍎' },
    { word: 'Banana', korean: '바나나', image: '🍌' },
    { word: 'Cat', korean: '고양이', image: '🐱' },
    { word: 'Dog', korean: '강아지', image: '🐕' },
    { word: 'Elephant', korean: '코끼리', image: '🐘' },
    { word: 'Fish', korean: '물고기', image: '🐟' },
    { word: 'Grapes', korean: '포도', image: '🍇' },
    { word: 'House', korean: '집', image: '🏠' },
    { word: 'Ice cream', korean: '아이스크림', image: '🍦' },
    { word: 'Juice', korean: '주스', image: '🧃' },
    { word: 'Kite', korean: '연', image: '🪁' },
    { word: 'Lion', korean: '사자', image: '🦁' },
    { word: 'Moon', korean: '달', image: '🌙' },
    { word: 'Notebook', korean: '공책', image: '📓' },
    { word: 'Orange', korean: '오렌지', image: '🍊' },
    { word: 'Pencil', korean: '연필', image: '✏️' },
    { word: 'Queen', korean: '여왕', image: '👑' },
    { word: 'Rabbit', korean: '토끼', image: '🐰' },
    { word: 'Sun', korean: '태양', image: '☀️' },
    { word: 'Tree', korean: '나무', image: '🌳' },
    { word: 'Umbrella', korean: '우산', image: '☂️' },
    { word: 'Violin', korean: '바이올린', image: '🎻' },
    { word: 'Water', korean: '물', image: '💧' },
    { word: 'Box', korean: '상자', image: '📦' },
    { word: 'Yo-yo', korean: '요요', image: '🪀' },
    { word: 'Zebra', korean: '얼룩말', image: '🦓' }
  ],
  intermediate: [
    { word: 'Beautiful', korean: '아름다운', image: '🌸' },
    { word: 'Computer', korean: '컴퓨터', image: '💻' },
    { word: 'Delicious', korean: '맛있는', image: '😋' },
    { word: 'Exercise', korean: '운동', image: '🏃' },
    { word: 'Family', korean: '가족', image: '👨‍👩‍👧‍👦' },
    { word: 'Garden', korean: '정원', image: '🌷' },
    { word: 'Hospital', korean: '병원', image: '🏥' },
    { word: 'Important', korean: '중요한', image: '⭐' },
    { word: 'Journey', korean: '여행', image: '✈️' },
    { word: 'Kitchen', korean: '주방', image: '🍳' },
    { word: 'Library', korean: '도서관', image: '📚' },
    { word: 'Mountain', korean: '산', image: '⛰️' },
    { word: 'Neighbor', korean: '이웃', image: '🏘️' },
    { word: 'Ocean', korean: '바다', image: '🌊' },
    { word: 'Picture', korean: '그림', image: '🖼️' },
    { word: 'Question', korean: '질문', image: '❓' },
    { word: 'Restaurant', korean: '식당', image: '🍽️' },
    { word: 'School', korean: '학교', image: '🏫' },
    { word: 'Teacher', korean: '선생님', image: '👩‍🏫' },
    { word: 'Universe', korean: '우주', image: '🌌' }
  ],
  sentences: [
    { word: 'Hello!', korean: '안녕하세요!', image: '👋' },
    { word: 'Thank you.', korean: '감사합니다.', image: '🙏' },
    { word: 'I love you.', korean: '사랑해요.', image: '❤️' },
    { word: 'Good morning.', korean: '좋은 아침이에요.', image: '🌅' },
    { word: 'Good night.', korean: '잘 자요.', image: '🌙' },
    { word: 'How are you?', korean: '어떻게 지내요?', image: '😊' },
    { word: 'I am happy.', korean: '나는 행복해요.', image: '😄' },
    { word: 'What is this?', korean: '이것은 무엇인가요?', image: '🤔' },
    { word: 'I like apples.', korean: '나는 사과를 좋아해요.', image: '🍎' },
    { word: 'Let\'s play!', korean: '같이 놀자!', image: '🎮' },
    { word: 'See you later.', korean: '나중에 봐요.', image: '👋' },
    { word: 'I am hungry.', korean: '배가 고파요.', image: '🍽️' },
    { word: 'It is raining.', korean: '비가 와요.', image: '🌧️' },
    { word: 'I have a book.', korean: '나는 책이 있어요.', image: '📖' },
    { word: 'This is my dog.', korean: '이것은 내 강아지예요.', image: '🐕' }
  ]
};

// ========== 상태 변수 ==========
let currentScreen = 'mainMenu';
let mathGrade = 1;
let mathScore = 0;
let mathCorrect = 0;
let mathTotal = 0;
let currentMathAnswer = 0;

let englishLevel = 'basic';
let englishMode = 'learn';
let englishScore = 0;
let englishCorrect = 0;
let englishTotal = 0;
let currentWordIndex = 0;
let currentEnglishAnswer = '';

// ========== 음성 합성 ==========
function speak(text, lang = 'en-US') {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang;
    utterance.rate = 0.8;
    utterance.pitch = 1.1;
    window.speechSynthesis.speak(utterance);
  }
}

function speakWord() {
  const words = englishData[englishLevel];
  const word = words[currentWordIndex];
  speak(word.word);
}

// ========== 화면 전환 ==========
function showScreen(screenId) {
  document.querySelectorAll('.main-menu, .game-screen').forEach(el => {
    el.style.display = 'none';
    el.classList.remove('active');
  });

  const screen = document.getElementById(screenId);
  if (screenId === 'mainMenu') {
    screen.style.display = 'flex';
  } else {
    screen.style.display = 'block';
  }
  screen.classList.add('active');
  currentScreen = screenId;
}

function goHome() {
  document.getElementById('resultScreen').classList.remove('active');
  showScreen('mainMenu');
}

// ========== 수학 게임 ==========
function startMath() {
  showScreen('mathGame');
  mathScore = 0;
  mathCorrect = 0;
  mathTotal = 0;
  updateMathScore();
  generateMathQuestion();
}

function setMathGrade(grade) {
  mathGrade = grade;
  document.querySelectorAll('.grade-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i + 1 === grade);
  });
  generateMathQuestion();
}

function generateMathQuestion() {
  let num1, num2, operator, answer;

  if (mathGrade === 1) {
    // 1학년: 10 이하 덧셈, 뺄셈
    num1 = Math.floor(Math.random() * 10) + 1;
    num2 = Math.floor(Math.random() * 10) + 1;
    if (Math.random() > 0.5) {
      operator = '+';
      answer = num1 + num2;
    } else {
      if (num1 < num2) [num1, num2] = [num2, num1];
      operator = '-';
      answer = num1 - num2;
    }
  } else if (mathGrade === 2) {
    // 2학년: 두 자리 수 덧셈/뺄셈, 구구단
    const type = Math.random();
    if (type < 0.4) {
      num1 = Math.floor(Math.random() * 50) + 10;
      num2 = Math.floor(Math.random() * 30) + 1;
      operator = '+';
      answer = num1 + num2;
    } else if (type < 0.7) {
      num1 = Math.floor(Math.random() * 50) + 30;
      num2 = Math.floor(Math.random() * 30) + 1;
      operator = '-';
      answer = num1 - num2;
    } else {
      num1 = Math.floor(Math.random() * 9) + 1;
      num2 = Math.floor(Math.random() * 9) + 1;
      operator = '×';
      answer = num1 * num2;
    }
  } else {
    // 3학년: 곱셈, 나눗셈, 큰 수
    const type = Math.random();
    if (type < 0.35) {
      num1 = Math.floor(Math.random() * 12) + 1;
      num2 = Math.floor(Math.random() * 12) + 1;
      operator = '×';
      answer = num1 * num2;
    } else if (type < 0.7) {
      num2 = Math.floor(Math.random() * 9) + 1;
      answer = Math.floor(Math.random() * 9) + 1;
      num1 = num2 * answer;
      operator = '÷';
    } else {
      num1 = Math.floor(Math.random() * 100) + 50;
      num2 = Math.floor(Math.random() * 50) + 1;
      operator = Math.random() > 0.5 ? '+' : '-';
      if (operator === '-' && num1 < num2) [num1, num2] = [num2, num1];
      answer = operator === '+' ? num1 + num2 : num1 - num2;
    }
  }

  currentMathAnswer = answer;
  document.getElementById('mathQuestion').textContent = `${num1} ${operator} ${num2} = ?`;

  // 선택지 생성
  const options = generateOptions(answer, mathGrade === 1 ? 10 : 20);
  const answersDiv = document.getElementById('mathAnswers');
  answersDiv.innerHTML = options.map(opt =>
    `<button class="answer-btn" onclick="checkMathAnswer(${opt}, this)">${opt}</button>`
  ).join('');
}

function generateOptions(correct, range) {
  const options = new Set([correct]);
  while (options.size < 4) {
    let wrong = correct + Math.floor(Math.random() * range * 2) - range;
    if (wrong < 0) wrong = Math.abs(wrong);
    if (wrong !== correct) options.add(wrong);
  }
  return Array.from(options).sort(() => Math.random() - 0.5);
}

function checkMathAnswer(selected, btn) {
  mathTotal++;
  const correct = selected === currentMathAnswer;

  if (correct) {
    mathCorrect++;
    mathScore += 10;
    btn.classList.add('correct');
    showFeedback('🎉');
    speak('Great!', 'en-US');
  } else {
    btn.classList.add('wrong');
    showFeedback('😅');
    // 정답 표시
    document.querySelectorAll('.answer-btn').forEach(b => {
      if (parseInt(b.textContent) === currentMathAnswer) {
        b.classList.add('correct');
      }
    });
  }

  updateMathScore();
  updateProgress('mathProgress', mathTotal, 10);

  // 10문제마다 결과 표시
  if (mathTotal >= 10) {
    setTimeout(() => showResult('math'), 1000);
  } else {
    setTimeout(generateMathQuestion, 1000);
  }
}

function updateMathScore() {
  document.getElementById('mathScore').textContent = mathScore;
}

// ========== 영어 게임 ==========
function startEnglish() {
  showScreen('englishGame');
  englishScore = 0;
  englishCorrect = 0;
  englishTotal = 0;
  currentWordIndex = 0;
  updateEnglishScore();
  updateEnglishDisplay();
}

function setEnglishLevel(level) {
  englishLevel = level;
  currentWordIndex = 0;
  document.querySelectorAll('.level-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.includes(
      level === 'basic' ? '기초' : level === 'intermediate' ? '중급' : '문장'
    ));
  });
  updateEnglishDisplay();
}

function setEnglishMode(mode) {
  englishMode = mode;
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.includes(mode === 'learn' ? '배우기' : '퀴즈'));
  });

  document.getElementById('learnMode').style.display = mode === 'learn' ? 'block' : 'none';
  document.getElementById('quizMode').style.display = mode === 'quiz' ? 'block' : 'none';

  if (mode === 'quiz') {
    englishTotal = 0;
    englishCorrect = 0;
    generateEnglishQuiz();
  } else {
    updateEnglishDisplay();
  }
}

function updateEnglishDisplay() {
  const words = englishData[englishLevel];
  const word = words[currentWordIndex];

  document.getElementById('wordImage').textContent = word.image;
  document.getElementById('wordEnglish').textContent = word.word;
  document.getElementById('wordKorean').textContent = word.korean;

  updateProgress('englishProgress', currentWordIndex + 1, words.length);

  // 자동 발음
  speak(word.word);
}

function nextWord() {
  const words = englishData[englishLevel];
  currentWordIndex = (currentWordIndex + 1) % words.length;
  updateEnglishDisplay();
}

function prevWord() {
  const words = englishData[englishLevel];
  currentWordIndex = (currentWordIndex - 1 + words.length) % words.length;
  updateEnglishDisplay();
}

function generateEnglishQuiz() {
  const words = englishData[englishLevel];
  const correctWord = words[Math.floor(Math.random() * words.length)];
  currentEnglishAnswer = correctWord.korean;

  document.getElementById('quizWord').textContent = correctWord.word;
  document.getElementById('quizHint').textContent = correctWord.image;

  // 오답 생성
  const options = new Set([correctWord.korean]);
  while (options.size < 4) {
    const randomWord = words[Math.floor(Math.random() * words.length)];
    options.add(randomWord.korean);
  }

  const answersDiv = document.getElementById('englishAnswers');
  const shuffled = Array.from(options).sort(() => Math.random() - 0.5);
  answersDiv.innerHTML = shuffled.map(opt =>
    `<button class="answer-btn" onclick="checkEnglishAnswer('${opt}', this)">${opt}</button>`
  ).join('');

  // 문제 읽어주기
  speak(correctWord.word);
}

function checkEnglishAnswer(selected, btn) {
  englishTotal++;
  const correct = selected === currentEnglishAnswer;

  if (correct) {
    englishCorrect++;
    englishScore += 10;
    btn.classList.add('correct');
    showFeedback('🎉');
    speak('Excellent!', 'en-US');
  } else {
    btn.classList.add('wrong');
    showFeedback('😅');
    document.querySelectorAll('.answer-btn').forEach(b => {
      if (b.textContent === currentEnglishAnswer) {
        b.classList.add('correct');
      }
    });
  }

  updateEnglishScore();
  updateProgress('englishProgress', englishTotal, 10);

  if (englishTotal >= 10) {
    setTimeout(() => showResult('english'), 1000);
  } else {
    setTimeout(generateEnglishQuiz, 1000);
  }
}

function updateEnglishScore() {
  document.getElementById('englishScore').textContent = englishScore;
}

// ========== 공통 함수 ==========
function updateProgress(id, current, total) {
  const percent = (current / total) * 100;
  document.getElementById(id).style.width = `${percent}%`;
}

function showFeedback(emoji) {
  const feedback = document.getElementById('feedback');
  feedback.textContent = emoji;
  feedback.style.display = 'block';
  setTimeout(() => { feedback.style.display = 'none'; }, 800);
}

function showResult(type) {
  const correct = type === 'math' ? mathCorrect : englishCorrect;
  const total = 10;
  const percent = (correct / total) * 100;

  let emoji, title;
  if (percent >= 90) { emoji = '🏆'; title = '최고예요!'; }
  else if (percent >= 70) { emoji = '🎉'; title = '잘했어요!'; }
  else if (percent >= 50) { emoji = '😊'; title = '좋아요!'; }
  else { emoji = '💪'; title = '다시 도전!'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultScore').textContent = `${correct}/${total}`;
  document.getElementById('resultScreen').classList.add('active');

  if (percent >= 70) speak('Congratulations!', 'en-US');
}

function continueGame() {
  document.getElementById('resultScreen').classList.remove('active');

  if (currentScreen === 'mathGame') {
    mathTotal = 0;
    mathCorrect = 0;
    updateProgress('mathProgress', 0, 10);
    generateMathQuestion();
  } else {
    englishTotal = 0;
    englishCorrect = 0;
    updateProgress('englishProgress', 0, 10);
    if (englishMode === 'quiz') {
      generateEnglishQuiz();
    }
  }
}

// 초기화
document.addEventListener('DOMContentLoaded', () => {
  showScreen('mainMenu');
});
</script>
